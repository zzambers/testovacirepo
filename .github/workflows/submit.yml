name: Pre-submit tests

on:
  push:
    branches-ignore:
      - master
      - pr/*

jobs:
  macos_x64_test:
    name: macOS x64
    runs-on: "macos-13"
    steps:
      - name: Checkout the source
        uses: actions/checkout@v3
      - name: Test hostname
        run: |
          set -x
          hostname
          host $(hostname) || :
          nslookup $(hostname) || :
          ping -c 4 $(hostname) || :
          cat /etc/hosts

